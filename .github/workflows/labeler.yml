name: Labeler

# 변경된 경로를 보고 PR 에 라벨을 자동으로 붙인다.
# 규칙은 .github/labeler.yml 에 있다.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: labeler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
