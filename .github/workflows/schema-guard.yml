name: Schema Guard

# db/init/*.sql 이 바뀐 PR 에 재적용 방법을 자동으로 코멘트한다.
#
# 팀원마다 DB 를 띄우는 방식이 달라서(Docker / 로컬 MySQL / 원격 DB), 머지 후 각자
# 스키마를 다시 적용하지 않으면 "내 PC 에서만 안 되는" 문제가 생긴다. pull 만으로는
# DB 가 바뀌지 않는데 이걸 놓치기 쉬워서, PR 단계에서 눈에 띄게 남긴다.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'db/init/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    name: schema-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경된 스키마 파일 수집
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo 'list<<CHANGED_EOF'
            git diff --name-only "$BASE" "$HEAD" -- db/init | sed 's/^/- /'
            echo 'CHANGED_EOF'
          } >> "$GITHUB_OUTPUT"

      # 파일 목록을 script 안에 ${{ }} 로 끼워 넣지 않는다.
      # 목록이 JS 문자열 안에서 코드로 해석될 수 있다. env 로 넘겨 process.env 로 읽는다.
      #
      # 같은 PR 에 커밋이 쌓일 때마다 코멘트가 늘어나지 않도록,
      # 고정 문자열(marker)로 기존 코멘트를 찾아 수정한다.
      - name: PR 에 재적용 안내 코멘트
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.files.outputs.list }}
        with:
          script: |
            const NL = '\n';
            const marker = '<!-- schema-guard -->';
            const changed = (process.env.CHANGED || '').trim() || '- (목록을 읽지 못했습니다)';
            const body = [
              marker,
              '## ⚠️ DB 스키마가 변경되었습니다',
              '',
              '변경된 파일',
              '',
              changed,
              '',
              '**이 PR 이 머지되면 팀원 전원이 각자 스키마를 다시 적용해야 합니다.** `git pull` 만으로는 DB 가 바뀌지 않습니다.',
              '',
              '```bash',
              '# Docker 로 띄우는 경우 — 볼륨을 지워야 initdb 가 다시 실행됩니다',
              'docker compose down -v && docker compose up -d',
              '',
              '# 로컬 MySQL 로 띄우는 경우',
              'mysql -u root -p foten < db/init/01-schema.sql',
              'mysql -u root -p foten < db/init/02-seed.sql',
              '```',
              '',
              '리뷰어 확인 사항',
              '',
              '- [ ] 금액 컬럼이 `DECIMAL` 인가요? (`DOUBLE` 은 누적 계산에서 오차가 쌓입니다)',
              '- [ ] MySQL 예약어를 컬럼명으로 쓰지 않았나요? (`order` `rank` `desc` `interval`)',
              '- [ ] 시드(`02-seed.sql`)가 여러 번 실행돼도 안전한가요?',
              '- [ ] 머지 후 팀 채널에 공지할 사람이 정해졌나요?',
            ].join(NL);

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
