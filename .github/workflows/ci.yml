name: CI

# Docker 없이 Gradle 과 Node 만으로 빌드가 끝나야 한다.
# 팀원 중 한 명이 Docker 를 쓰지 못하므로, CI 가 로컬 Docker 를 전제하면 안 된다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 잡 이름을 바꾸면 브랜치 보호의 "필수 체크" 이름도 함께 바꿔야 한다.
  # 안 바꾸면 PR 이 영원히 pending 으로 멈춘다.
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # BE 프로젝트가 아직 없을 때도 CI 가 빨간불이 되지 않게 한다.
      # Gradle 프로젝트를 넣으면 이 단계는 자동으로 실제 빌드로 넘어간다.
      - name: Gradle 프로젝트 존재 확인
        id: check
        run: |
          if [ -f BE/gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BE/gradlew 가 아직 없어 백엔드 빌드를 건너뜁니다."
          fi

      - name: 빌드
        if: steps.check.outputs.exists == 'true'
        working-directory: BE
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Vite 프로젝트 존재 확인
        id: check
        run: |
          if [ -f FE/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FE/package.json 이 아직 없어 프론트엔드 빌드를 건너뜁니다."
          fi

      - name: 의존성 설치
        if: steps.check.outputs.exists == 'true'
        working-directory: FE
        run: npm ci

      - name: 린트
        if: steps.check.outputs.exists == 'true'
        working-directory: FE
        run: npm run lint --if-present

      - name: 빌드
        if: steps.check.outputs.exists == 'true'
        working-directory: FE
        run: npm run build
