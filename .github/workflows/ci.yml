name: CI

# Docker 없이 Gradle 과 Node 만으로 빌드가 끝나야 한다.
# 팀원 중 한 명이 Docker 를 쓰지 못하므로, CI 가 로컬 Docker 를 전제하면 안 된다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 잡 이름을 바꾸면 브랜치 보호의 "필수 체크" 이름도 함께 바꿔야 한다.
  # 안 바꾸면 PR 이 영원히 pending 으로 멈춘다.
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-java 의 gradle 캐시는 빌드 파일이 하나도 없으면 실패한다.
      # 그래서 존재 확인을 setup 보다 먼저 둔다. 이 단계는 JDK 가 필요 없다.
      - name: Gradle 프로젝트 존재 확인
        id: check
        run: |
          if [ -f BE/gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BE/gradlew 가 아직 없어 백엔드 빌드를 건너뜁니다."
          fi

      - uses: actions/setup-java@v5
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 빌드
        if: steps.check.outputs.exists == 'true'
        working-directory: BE
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node 의 npm 캐시도 cache-dependency-path 가 실제로 있어야 한다.
      # 없으면 "Some specified paths were not resolved" 로 잡이 죽는다.
      - name: Vite 프로젝트 존재 확인
        id: check
        run: |
          if [ -f FE/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FE/package.json 이 아직 없어 프론트엔드 빌드를 건너뜁니다."
          fi

      # lock 파일이 생기기 전에도 돌 수 있어야 하므로 캐시는 있을 때만 켠다.
      - name: lock 파일 확인
        id: lock
        if: steps.check.outputs.exists == 'true'
        run: |
          if [ -f FE/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true' && steps.lock.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true' && steps.lock.outputs.exists != 'true'
        with:
          node-version: '20'

      - name: 의존성 설치
        if: steps.check.outputs.exists == 'true'
        working-directory: FE
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::FE/package-lock.json 이 없어 npm install 로 대체합니다. lock 파일을 커밋하세요."
            npm install
          fi

      - name: 린트
        if: steps.check.outputs.exists == 'true'
        working-directory: FE
        run: npm run lint --if-present

      - name: 빌드
        if: steps.check.outputs.exists == 'true'
        working-directory: FE
        run: npm run build
