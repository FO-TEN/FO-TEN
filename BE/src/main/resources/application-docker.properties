# docker-compose 실행용. docker-compose.yml 의 app 서비스가 env_file(.env) 로
# DB_URL 등을 주입한다 (호스트명이 컨테이너 이름 mysql). 기본값도 같은 형태로 맞춰둔다.
db.url=${DB_URL:jdbc:mysql://mysql:3306/foten?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
db.username=${DB_USERNAME:foten}
db.password=${DB_PASSWORD:foten}

exchange.rate.cron=${EXCHANGE_RATE_CRON:0 0 12 * * *}
exchange.rate.base-url=${EXCHANGE_RATE_BASE_URL:https://open.er-api.com/v6/latest}

llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:}
llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}