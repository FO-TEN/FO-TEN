plugins {
    id 'java'
    id 'war'
}

group = 'com.foten'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// 소스에 한글 주석이 섞여 있으므로, OS 기본 인코딩(Windows 는 CP949)에
// 의존하지 않게 컴파일러 인코딩을 명시적으로 고정한다.


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    springVersion = '5.3.39'
}

dependencies {
    // Spring MVC (Legacy, not Spring Boot)
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"

    // MyBatis
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis-spring:2.1.2'

    // MySQL / connection pool
    runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'

    // 로깅 (SLF4J + Logback)
    implementation 'ch.qos.logback:logback-classic:1.5.7'

    // Tomcat 9 provides the Servlet 4.0 (javax.servlet) API at runtime.
    // Do NOT use jakarta.servlet-api here — Tomcat 9 is javax-based; jakarta
    // compiles fine but the app will not start at runtime.
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Test
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

war {
    archiveFileName = 'foten.war'
}
